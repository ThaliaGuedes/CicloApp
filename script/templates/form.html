<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro do Ciclo 💖</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: #ffe4e1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    position: relative;
    padding: 20px 12px;
}

/* Coração de fundo */
.heart-bg {
    position: absolute;
    font-size: 15rem;
    color: #ff69b4;
    opacity: 0.2;
    animation: pulse 2s infinite;
    user-select: none;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.form-container {
    position: relative;
    z-index: 1;
    width: min(100%, 420px);
    background: rgba(255, 240, 245, 0.9);
    padding: clamp(20px, 6vw, 32px);
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    text-align: center;
}

form {
    text-align: left;
}

input, button {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 12px;
    margin: 8px 0 16px;
    border-radius: 10px;
    border: 1px solid #ff69b4;
    font-size: 1rem;
}

button {
    background-color: #ff69b4;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #e91e63;
}

label {
    display: block;
    font-weight: bold;
    color: #ff1493;
    margin-top: 12px;
}

h2 {
    color: #e91e63;
    margin: 0 0 20px;
}

.form-note {
    color: #6b4052;
    font-size: 0.9rem;
    line-height: 1.5;
    margin: -4px 0 18px;
}

@media (max-width: 500px) {
    .heart-bg {
        font-size: 10rem;
    }
}
</style>
</head>
<body>

<div class="heart-bg">❤️</div>

<div class="form-container">
    <h2>💖 Cadastre seu Ciclo 💖</h2>
    <form method="POST" action="/register">
        <label>Nome:</label>
        <input type="text" name="name" required placeholder="Seu nome">

        <label>Email:</label>
        <input type="email" name="email" required placeholder="email@exemplo.com">

        <label for="period_start">Data de início do último período:</label>
        <input type="date" id="period_start" name="period_start" required>

        <label for="period_end">Data de fim do último período:</label>
        <input type="date" id="period_end" name="period_end" required>

        <p class="form-note">A estimativa da fase usa um ciclo padrão de 30 dias.</p>

        <button type="submit">💌 Cadastrar</button>
    </form>
</div>

</body>
</html>
