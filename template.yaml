AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Aplicacao de cadastro de ciclo menstrual

Parameters:
  SenderEmail:
    Type: String
    Description: Endereco verificado no Amazon SES usado como remetente

Resources:
  CicloTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  CicloApp:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: script/
      Handler: lambda.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 15
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          DYNAMO_TABLE: !Ref CicloTable
          DYNAMO_PK: user_id
          SENDER_EMAIL: !Ref SenderEmail
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Scan
              Resource: !GetAtt CicloTable.Arn
            - Effect: Allow
              Action:
                - ses:ListVerifiedEmailAddresses
                - ses:VerifyEmailIdentity
                - ses:SendEmail
              Resource: '*'

Outputs:
  WebUrl:
    Description: URL publica da aplicacao
    Value: !GetAtt CicloAppUrl.FunctionUrl